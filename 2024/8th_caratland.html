                if (meta) meta.setAttribute('content', '#f8f9fa');

    const today = new Date();
    if (ep.date) {
        const releaseDate = new Date(ep.date);
        if (releaseDate > today) {
            alert(`This episode is not yet available.\nRelease Date: ${ep.date}`);
            return; 
        }
    }

    if (updateUrl) {
        const newUrl = window.location.pathname + '?v=' + ep.id;
        history.pushState({id: ep.id}, '', newUrl);
    }

    window.currentEpData = ep;
    window.hasSkippedIntro = false;
    window.introEndTime = ep.introEnd || 0;

    posterContainer.style.display = "none";
    playerContainer.style.display = "block";

    document.querySelectorAll('.playlist-item').forEach(item => {
        item.classList.remove('active', 'is-paused');
        if(item.dataset.id === epId) item.classList.add('active');
    });

    let pageIdentifier = window.location.pathname.split("/").pop().replace(".html", "");
    if (!pageIdentifier || pageIdentifier === "") pageIdentifier = "videos"; 
    
    const uniqueHistoryKey = `${ep.id}_${pageIdentifier}`;

    
    // Load metadata from Firebase
    db.ref(`caratland2024/${ep.id}`).once('value').then(async snapshot => {
      const data = snapshot.val();
      if(!data || !data.url) { alert("Video unavailable"); return; }

      let artSubtitles = [];
      if (data.subtitles) {
          if (typeof data.subtitles === 'object') {
              Object.entries(data.subtitles).forEach(([lang, url]) => {
                  artSubtitles.push({ html: lang.toUpperCase(), url: url, default: lang.toLowerCase() === 'en' });
              });
          } else if (typeof data.subtitles === 'string') {
              artSubtitles.push({ html: 'SUBTITLES', url: data.subtitles, default: true });
          }
      }

      if(data.title) mainTitle.textContent = data.title;
      else mainTitle.textContent = ep.title;

      startArtPlayer(data.url, data.title || ep.title, ep.image, artSubtitles, 0, uniqueHistoryKey);
    }).catch(err => {
      console.error(err);
      alert("Error loading video");
    });
    
}

function startArtPlayer(videoUrl, videoTitle, posterImg, artSubtitles, startTime, uniqueHistoryKey) {
    if (art) {
        art.switchUrl(videoUrl, videoTitle);
        art.poster = posterImg;

        if (artSubtitles && artSubtitles.length > 0) {
            const defaultSub = artSubtitles.find(s => s.default) || artSubtitles[0];
            art.subtitle.switch(defaultSub.url, { name: defaultSub.html });
        } else {
            art.subtitle.switch('', { name: 'None' });
        }

        const user = auth.currentUser;
        if (user && !startTime) {
            db.ref('watchHistory/' + user.uid + '/' + uniqueHistoryKey).once('value').then(snap => {
                const saved = snap.val();
                art.once('video:loadedmetadata', () => {
                    if (saved && saved.currentTime > 0) {
                        art.currentTime = saved.currentTime;
                        if(saved.currentTime > window.introEndTime) { window.hasSkippedIntro = true; }
                        art.notice.show = 'Resumed video';
                    }
                    art.play();
                });
            });
        } else {
            if (startTime > 0) art.currentTime = startTime;
            art.play();
        }
        return; 
    }

    art = new Artplayer({
        container: '#artplayer',
        url: videoUrl,
        title: videoTitle,
        poster: posterImg,
        volume: 0.5,
        isLive: false,
        muted: false,
        autoplay: true,
        setting: true,
        fullscreen: true,
        fullscreenWeb: true,
        miniProgressBar: true,
        autoOrientation: true,
        lock: true,
        fastForward: true,
        mutex: true,
        backdrop: true,
        playsInline: true,
        autoPlayback: true,
        airplay: true,
        theme: '#a1a1aa',
        
        subtitle: {
            url: artSubtitles && artSubtitles.find(s => s.default)?.url || '',
            type: 'vtt',
            encoding: 'utf-8',
            style: {
                color: '#ffffff',
                textAlign: 'center',
                background: 'none'
            }
        },

        moreVideoAttr: {
            playsInline: true,
            'webkit-playsinline': true,
            'x5-video-player-type': 'h5',
            'x5-video-player-fullscreen': 'true',
            'x5-video-orientation': 'landscape'
        },
        
        customType: {
            m3u8: function (video, url) {
                if (art && art.hls) { art.hls.destroy(); }
                if (Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    if (art) art.hls = hls; 

                    hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                        let qualityOptions = [{ html: 'Auto', level: -1, default: true }];
                        
                        data.levels.forEach((level, index) => {
                            qualityOptions.push({
                                html: level.height + 'p',
                                level: index,
                                default: false
                            });
                        });

                        qualityOptions.sort((a, b) => {
                            if (a.level === -1) return -1;
                            if (b.level === -1) return 1;
                            return b.level - a.level;
                        });

                        art.setting.add({
                            name: 'video-quality',
                            html: 'Quality',
                            tooltip: 'Auto',
                            width: 200,
                            selector: qualityOptions,
                            onSelect: function (item) {
                                if (art.hls) {
                                    art.hls.currentLevel = item.level;
                                }
                                return item.html;
                            }
                        });
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
            },
        },
    });

    art.layers.add({
        name: 'nextEpLayer',
        html: '<button class="next-ep-btn" onclick="event.stopPropagation(); window.playNextEpisodeGlobal();">Next Episode ⏭</button>',
        style: { display: 'none' } 
    });

    art.layers.add({
        name: 'skipIntroLayer',
        html: '<button class="skip-intro-btn" onclick="event.stopPropagation(); window.skipIntroGlobal();">Skip Intro</button>',
        style: { display: 'none' } 
    });

    if(artSubtitles && artSubtitles.length > 0) {
        art.setting.add({
            html: 'Subtitles',
            width: 200,
            selector: artSubtitles.map(s => {
                return { html: s.html, url: s.url, default: s.default };
            }),
            onSelect: function (item) {
                art.subtitle.switch(item.url, { name: item.html });
                return item.html;
            },
        });
    }

    art.on('play', () => { document.querySelectorAll('.playlist-item.active').forEach(item => item.classList.remove('is-paused')); });
    art.on('pause', () => { document.querySelectorAll('.playlist-item.active').forEach(item => item.classList.add('is-paused')); });

    // Gesture control overlay
    const catcher = document.getElementById('click-catcher');
    if (catcher) {
        let clickTimer = null;
        let lastTapTime = 0;
        catcher.addEventListener('click', (e) => {
            const now = new Date().getTime();
            const timeSinceLastTap = now - lastTapTime;
            const rect = catcher.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const width = rect.width;

            if (timeSinceLastTap < 300 && timeSinceLastTap > 0) {
                clearTimeout(clickTimer);
                if (x < width * 0.35) {
                    art.seek = Math.max(0, art.currentTime - 10);
                    showGestureFeedback('icon-rewind');
                } else if (x > width * 0.65) {
                    art.seek = Math.min(art.duration || Infinity, art.currentTime + 10);
                    showGestureFeedback('icon-forward');
                } else {
                    art.toggle();
                }
            } else {
                clickTimer = setTimeout(() => {
                    art.toggle();
                    if(art.playing) showGestureFeedback('icon-play');
                    else showGestureFeedback('icon-pause');
                }, 300);
            }
            lastTapTime = now;
        });
    }

    function showGestureFeedback(id) {
        const el = document.getElementById(id);
        if (el) {
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 500);
        }
    }

    const user = auth.currentUser;
    if (user && !startTime) {
        db.ref('watchHistory/' + user.uid + '/' + uniqueHistoryKey).once('value').then(snap => {
            const saved = snap.val();
            if (saved && saved.currentTime > 0) {
                art.on('ready', () => {
                    art.seek = saved.currentTime;
                    if(saved.currentTime > window.introEndTime) { window.hasSkippedIntro = true; }
                    art.play();
                    art.notice.show = 'Resumed video';
                });
            }
        });
    } else if (startTime > 0) {
        art.on('ready', () => {
            art.seek = startTime;
            art.play();
        });
    }

    let lastSave = 0;
    art.on('video:timeupdate', () => {
        const now = Date.now();
        
        if (art.duration > 0 && art.layers.nextEpLayer) {
            const timeLeft = art.duration - art.currentTime;
            const currentIndex = playlistData.findIndex(item => item.id === window.currentEpData.id);
            const hasNext = currentIndex >= 0 && currentIndex < playlistData.length - 1;

            if (timeLeft <= 60 && hasNext) { art.layers.nextEpLayer.style.display = 'block'; } 
            else { art.layers.nextEpLayer.style.display = 'none'; }
        }

        if (window.introEndTime > 0 && art.layers.skipIntroLayer) {
            if (!window.hasSkippedIntro && art.currentTime > 0 && art.currentTime < window.introEndTime) {
                art.layers.skipIntroLayer.style.display = 'block';
            } else {
                art.layers.skipIntroLayer.style.display = 'none';
            }
        }

        if (auth.currentUser && art && !art.video.paused && now - lastSave > 5000 && window.currentEpData) {
            let pageId = window.location.pathname.split("/").pop().replace(".html", "") || "videos";
            const dynamicHistoryKey = `${window.currentEpData.id}_${pageId}`;
            const historyData = {
                id: window.currentEpData.id,
                title: window.currentEpData.title,
                image: window.currentEpData.image,
                currentTime: art.currentTime,
                duration: art.duration || 0,
                timestamp: now,
                page: pageId
            };
            db.ref('watchHistory/' + auth.currentUser.uid + '/' + dynamicHistoryKey).update(historyData).catch(() => {});
            lastSave = now;
        }
    });
}

window.addEventListener('popstate', (event) => {
    if (event.state && event.state.id) loadAndPlayEpisode(event.state.id, false);
    else { 
        posterContainer.style.display = "flex"; 
        playerContainer.style.display = "none"; 
        mainTitle.textContent = '';
        document.querySelectorAll('.playlist-item').forEach(item => item.classList.remove('active', 'is-paused'));
        if(art) art.pause(); 
    }
});

// Render playlist items
playlistData.forEach(ep => {
  const epDiv = document.createElement('div');
  epDiv.className = 'playlist-item';
  epDiv.dataset.id = ep.id;

  const today = new Date();
  let isLocked = false;
  if (ep.date) {
      const releaseDate = new Date(ep.date);
      if (releaseDate > today) isLocked = true;
  }
  if (isLocked) epDiv.classList.add('locked');

  const imgWrapper = document.createElement('div');
  imgWrapper.className = "playlist-img-wrapper";
  
  const img = document.createElement('img'); 
  img.src = ep.image; 
  img.loading = "lazy";
  img.alt = ep.title;
  
  imgWrapper.appendChild(img);
  
  const textDiv = document.createElement('div'); 
  textDiv.className = "playlist-text";
  
  const title = document.createElement('span'); 
  title.className = "playlist-title"; 
  title.textContent = ep.title;
  textDiv.appendChild(title);

  if (ep.status) {
      const statusSpan = document.createElement('span');
      statusSpan.className = "playlist-status";
      statusSpan.textContent = ep.status;
      textDiv.appendChild(statusSpan);
      if(ep.status === "NOT AVAILABLE") { epDiv.style.opacity = "0.6"; }
  }

  const indicator = document.createElement('div');
  indicator.className = 'playing-indicator';
  indicator.innerHTML = '<div class="bar"></div><div class="bar"></div><div class="bar"></div>';
  
  epDiv.appendChild(imgWrapper); 
  epDiv.appendChild(textDiv);
  epDiv.appendChild(indicator);
  
  epDiv.addEventListener('click', () => loadAndPlayEpisode(ep.id, true));
  playlistContainer.appendChild(epDiv);
});

window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    if (videoId) {
        setTimeout(() => loadAndPlayEpisode(videoId, false), 500);
    }
});
</script>

<script>
  // Access Guard (Free Access - allows verified users & internal transitions)
  const allowedPaths = [
    '/index.html', '/index', '/',
    '/home.html', '/home',
    '/videos.html', '/videos',
    '/collection.html', '/collection',
    '/profile.html', '/profile',
    '/nanabnb.html', '/newtour.html',
    '/hxwfanconcert.html', '/svtholiday.html',
    '/arenatour.html', '/svtjapanconcert.html',
    '/touragain.html', '/gallery.html',
    '/soon.html'
  ];

  const currentPage = window.location.pathname;
  let hasInternalAccess = sessionStorage.getItem('internalAccess') === 'true' || localStorage.getItem('internalAccess') === 'true';

  try {
    const rawCache = localStorage.getItem('zone_vault_user_cache');
    if (rawCache) {
      const u = JSON.parse(rawCache);
      if (u && (u.status === 'approved' || u.isAdmin || u.role === 'admin' || u.uid)) {
        hasInternalAccess = true;
        sessionStorage.setItem('internalAccess', 'true');
        localStorage.setItem('internalAccess', 'true');
      }
    }
  } catch (e) {}

  const referrer = document.referrer;
  let cameFromAllowedPage = false;
  if (referrer) {
    try {
      const refUrl = new URL(referrer);
      if (refUrl.origin === window.location.origin) {
        const refP = refUrl.pathname;
        if (allowedPaths.includes(refP) || refP.startsWith('/202') || refP.startsWith('/random') || refP.startsWith('/special_gift')) {
          cameFromAllowedPage = true;
        }
      }
    } catch (_) {}
  }

  if (cameFromAllowedPage) {
    sessionStorage.setItem('internalAccess', 'true');
    localStorage.setItem('internalAccess', 'true');
    hasInternalAccess = true;
  }

  const isIndexPage = currentPage.endsWith('index.html') || currentPage === '/';
  if (!hasInternalAccess && !isIndexPage) {
    showAccessDeniedModal();
    auth.onAuthStateChanged(user => {
      if (user) {
        sessionStorage.setItem('internalAccess', 'true');
        localStorage.setItem('internalAccess', 'true');
        removeAccessDeniedModal();
      }
    });
  }

  let redirectTimer = null;
  function showAccessDeniedModal() {
    if (document.querySelector('.access-denied-modal')) return;
    const modal = document.createElement('div');
    modal.className = 'access-denied-modal';
    modal.innerHTML = `
      <strong>🚫 Access Denied</strong>
      <div>You cannot access this page directly.<br>
      Please go through the homepage or allowed sections.</div>
      <div id="redirectTimer" style="margin-top:10px; opacity: 0.7;">Redirecting in <span id="cnt">3</span> seconds...</div>
      <button onclick="goBack()">Go Back</button>
    `;
    document.body.appendChild(modal);

    let countdown = 3;
    const timer = document.getElementById('cnt');
    if (redirectTimer) clearInterval(redirectTimer);
    redirectTimer = setInterval(() => {
      countdown--;
      if (timer) timer.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(redirectTimer);
        window.location.href = "/videos";
      }
    }, 1000);
  }

  function removeAccessDeniedModal() {
    if (redirectTimer) {
      clearInterval(redirectTimer);
      redirectTimer = null;
    }
    const modal = document.querySelector('.access-denied-modal');
    if (modal) modal.remove();
  }

  function goBack() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = "/videos";
    }
  }
</script>
