  <script>
    (function() {
        function applyTheme(theme) {
            if (theme === 'light' || theme === '#ffffff' || theme === 'white') {
                document.documentElement.classList.add('light-mode');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8f9fa');
            } else {
                document.documentElement.classList.remove('light-mode');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0c');
            }
        }
        const savedTheme = localStorage.getItem('zoneTheme') || localStorage.getItem('zoneVaultTheme');
        if (savedTheme) { applyTheme(savedTheme); } 
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) { applyTheme('light'); }

        window.addEventListener('storage', (e) => {
            if (e.key === 'zoneTheme' || e.key === 'zoneVaultTheme') { applyTheme(e.newValue); }
        });

<script>
const THUMBNAIL = "https://res.cloudinary.com/sanuqblh/image/upload/v1794122542/cf49fd9d-308c-4334-a64d-105ee07f9f69_a00ec4.png";

// Default 30 video cards (populated from encrypted nanatour_config.js in RAM)
let playlistData = Array.from({ length: 30 }, (_, idx) => ({
  id: String(idx + 1),
  title: "",
  image: THUMBNAIL,
  startTime: "00:00:00",

// Parse "HH:MM:SS" or "MM:SS" or seconds into total seconds
function parseTimestampToSeconds(val) {
    if (val === null || val === undefined || val === '') return 0;
    if (typeof val === 'number') return Math.max(0, val);
    const trimmed = String(val).trim();
    if (!trimmed) return 0;
    if (/^\d+(\.\d+)?$/.test(trimmed)) return Math.max(0, parseFloat(trimmed));

    const parts = trimmed.split(':').map(p => parseFloat(p) || 0);
    if (parts.length === 3) {
        return Math.max(0, parts[0] * 3600 + parts[1] * 60 + parts[2]);
    }
    if (parts.length === 2) {
        return Math.max(0, parts[0] * 60 + parts[1]);
    }
    return 0;
}

// Compute [startSec, endSec) for a card; if endTime is blank, auto-detect from the next card sharing the same .m3u8 URL
function getCardTimeRange(epId, allMedia) {
    const list = allMedia || (window.__ZV_NANATOUR_VAULT__ && typeof window.__ZV_NANATOUR_VAULT__.getAllMedia === 'function'
        ? window.__ZV_NANATOUR_VAULT__.getAllMedia()
        : []);
    const idx = list.findIndex(item => String(item.id) === String(epId));
    if (idx === -1) return { startSec: 0, endSec: 0 };

    const current = list[idx];
    const startSec = parseTimestampToSeconds(current.startTime);
    let endSec = parseTimestampToSeconds(current.endTime);

    if (endSec <= startSec && current.url) {
        const nextItem = list[idx + 1];
        if (nextItem && nextItem.url === current.url) {
            const nextStart = parseTimestampToSeconds(nextItem.startTime);
            if (nextStart > startSec) {
                endSec = nextStart;
            }
        }
    }
    return { startSec, endSec };
}

// Fetch & decrypt nanatour_config.js exclusively in browser RAM via disguised /api/zv-vault-sync?k=nana26
function ensureVaultLoaded() {
    if (window.__ZV_NANATOUR_VAULT__) return Promise.resolve(window.__ZV_NANATOUR_VAULT__);
    if (vaultReadyPromise) return vaultReadyPromise;

    vaultReadyPromise = (async () => {
        try {
            const res = await fetch('/api/zv-vault-sync?k=nana26', {
                method: 'GET',
                headers: {
                    'X-ZV-Vault-Sync': 'ZV1',
                    'X-Requested-With': 'ZoneVaultPlayer'
                }
            });
            if (res.ok) {
                const encryptedPayload = await res.text();
                const decryptedJs = (window.ZoneVaultStream && typeof window.ZoneVaultStream.decryptPayload === 'function')
                    ? window.ZoneVaultStream.decryptPayload(encryptedPayload)
                    : encryptedPayload;
                if (decryptedJs && !decryptedJs.startsWith('ZV1.')) {
                    const execFn = new Function(decryptedJs);
                    execFn();
                }
            }
        } catch (_) {}

        if (window.__ZV_NANATOUR_VAULT__ && typeof window.__ZV_NANATOUR_VAULT__.getPlaylistMeta === 'function') {
            playlistData = window.__ZV_NANATOUR_VAULT__.getPlaylistMeta();
            if (window.__ZV_NANATOUR_VAULT__.thumbnail) {
                posterContainer.style.backgroundImage = `url("${window.__ZV_NANATOUR_VAULT__.thumbnail}")`;
            }
            renderPlaylistCards();
        }
        return window.__ZV_NANATOUR_VAULT__ || null;
    })();

    return vaultReadyPromise;
}

// Pre-warm the next card's time-shifted VTT subtitle in RAM so auto-switching across combined video parts is 0ms instant
async function prewarmNextCardSubtitle(currentEpId) {
    if (!window.__ZV_NANATOUR_VAULT__ || !window.ZoneVaultStream) return;
    const allMedia = window.__ZV_NANATOUR_VAULT__.getAllMedia();
    const idx = allMedia.findIndex(item => String(item.id) === String(currentEpId));
    if (idx === -1 || idx >= allMedia.length - 1) return;

    const nextMedia = allMedia[idx + 1];
    if (!nextMedia || !nextMedia.subtitle) return;
    const { startSec } = getCardTimeRange(nextMedia.id, allMedia);

    try {
        await window.ZoneVaultStream.resolveProtectedSubtitles([
            {
                html: 'SUBTITLES',
                url: String(nextMedia.subtitle).trim(),
                default: true,
                offsetSeconds: startSec
            }
        ]);
    } catch (_) {}
}

// Dynamically switch Artplayer's active subtitle to the current card's time-shifted .vtt Blob URL
async function switchActiveSubtitleForCard(media, startSec) {
    if (!art || !art.subtitle) return;
    if (!media || !media.subtitle || String(media.subtitle).trim() === '') {
        activeSubtitleCacheKey = null;
        return;
    }

    const subUrl = String(media.subtitle).trim();
    const cacheKey = `${subUrl}::offset=${Number(startSec) || 0}`;
    if (activeSubtitleCacheKey === cacheKey) return;
    activeSubtitleCacheKey = cacheKey;

    if (window.ZoneVaultStream && typeof window.ZoneVaultStream.resolveProtectedSubtitles === 'function') {
        const resolved = await window.ZoneVaultStream.resolveProtectedSubtitles([
            {
                html: 'SUBTITLES',
                url: subUrl,
                default: true,
                offsetSeconds: startSec
            }
        ]);
        if (resolved && resolved.length > 0 && resolved[0].url && art && art.subtitle) {
            art.subtitle.switch(resolved[0].url, { name: 'SUBTITLES', type: 'vtt' });
            art.subtitle.show = true;
        }
    }
    prewarmNextCardSubtitle(media.id);
}

// Global next-episode helper
window.playNextEpisodeGlobal = function() {
    if (!window.currentEpData) return;
    const currentIndex = playlistData.findIndex(item => item.id === window.currentEpData.id);
    if (currentIndex >= 0 && currentIndex < playlistData.length - 1) {
        const nextEp = playlistData[currentIndex + 1];
        loadAndPlayEpisode(nextEp.id, true);
    }
};

window.skipIntroGlobal = function() {
    if (!art || !window.introEndTime) return;
    art.currentTime = window.introEndTime;
    art.notice.show = 'Intro Skipped';
    window.hasSkippedIntro = true;
    if (art.layers && art.layers.skipIntroLayer) art.layers.skipIntroLayer.style.display = 'none';
};

// Poster click starts the first stream
posterContainer.addEventListener('click', () => {
    if (playlistData.length > 0) {
        loadAndPlayEpisode(playlistData[0].id, true);
    }
});

  appId: "1:308384754214:web:2938e76cd29b288f75d4e7",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// --- 3. HELPERS ---
function setActiveEpisode(ep) {
    window.currentEpData = ep;
    currentHistoryKey = `${ep.id}_${pageIdentifier}`;
    lastSavedHistory = null;
    mainTitle.textContent = ep.title || '';
    document.querySelectorAll('.playlist-item').forEach(item => {
        const isCurrent = item.dataset.id === ep.id;
        item.classList.toggle('active', isCurrent);
        item.classList.remove('is-paused');
        if (isCurrent) {
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });
}

// Monitors video playback time to automatically switch the active video card & separate .vtt subtitle file
// when a combined 2-hour episode crosses from one part's endTime into the next card's startTime
function handleCombinedEpisodeTimeUpdate(artInstance) {
    if (!artInstance || !window.currentEpData || !window.__ZV_NANATOUR_VAULT__) return;
    if (Date.now() < manualSeekLockUntil) return;

    const currentTime = Number(artInstance.currentTime) || 0;
    const allMedia = window.__ZV_NANATOUR_VAULT__.getAllMedia();
    const currentMedia = allMedia.find(item => String(item.id) === String(window.currentEpData.id));
    if (!currentMedia || !currentMedia.url) return;

    // Find all cards sharing this same combined .m3u8 URL
    const sameStreamCards = allMedia.filter(item => item.url === currentMedia.url);

    if (sameStreamCards.length > 1) {
        let matchedCard = null;
        let matchedRange = null;

        for (let i = 0; i < sameStreamCards.length; i++) {
            const candidate = sameStreamCards[i];
            const range = getCardTimeRange(candidate.id, allMedia);
            const hasExplicitRange = range.startSec > 0 || range.endSec > 0 || i === 0;
            if (!hasExplicitRange) continue;

            const afterStart = currentTime >= range.startSec;
            const beforeEnd = range.endSec > range.startSec ? currentTime < range.endSec : true;
            if (afterStart && beforeEnd) {
                matchedCard = candidate;
                matchedRange = range;
                break;
            }
        }

        if (matchedCard && String(matchedCard.id) !== String(window.currentEpData.id)) {
            const nextEpMeta = playlistData.find(item => String(item.id) === String(matchedCard.id)) || matchedCard;
            setActiveEpisode(nextEpMeta);
            history.replaceState({ id: nextEpMeta.id }, '', `${window.location.pathname}?v=${encodeURIComponent(nextEpMeta.id)}`);
            if (nextEpMeta.title) {
                artInstance.notice.show = `Now Playing: ${nextEpMeta.title}`;
            }
            switchActiveSubtitleForCard(matchedCard, matchedRange ? matchedRange.startSec : 0);
        }
    } else {
        // Standalone stream card with an explicit endTime
        const range = getCardTimeRange(currentMedia.id, allMedia);
        if (range.endSec > range.startSec && currentTime >= range.endSec) {
            manualSeekLockUntil = Date.now() + 2000;
            window.playNextEpisodeGlobal();
        }
    }
}

// --- 4. ARTPLAYER & LOGIC ---
async function loadAndPlayEpisode(epId, updateUrl = true) {
    await ensureVaultLoaded();

    const ep = playlistData.find(item => item.id === String(epId));
    if (!ep) return;

    const allMedia = (window.__ZV_NANATOUR_VAULT__ && typeof window.__ZV_NANATOUR_VAULT__.getAllMedia === 'function')
      ? window.__ZV_NANATOUR_VAULT__.getAllMedia()
      : [];
    const media = (window.__ZV_NANATOUR_VAULT__ && typeof window.__ZV_NANATOUR_VAULT__.getMediaById === 'function')
      ? window.__ZV_NANATOUR_VAULT__.getMediaById(ep.id)
      : null;

    if (!media || !media.url) {
        setActiveEpisode(ep);
        mainTitle.textContent = ep.title || 'Stream Coming Soon';
        return;
    }

    const { startSec, endSec } = getCardTimeRange(ep.id, allMedia);

    if (updateUrl) {
        history.pushState({ id: ep.id }, '', `${window.location.pathname}?v=${encodeURIComponent(ep.id)}`);
    }

    posterContainer.style.display = "none";
    playerContainer.style.display = "block";
    setActiveEpisode(ep);

    // If the player is already playing the exact same combined .m3u8 stream, seek smoothly to startSec
    // and swap in the new card's time-shifted .vtt subtitle without reloading the video stream
    if (art && art.video && currentStreamRawUrl === media.url) {
        manualSeekLockUntil = Date.now() + 1500;
        art.currentTime = startSec;
        art.play().catch(() => {});
        await switchActiveSubtitleForCard(media, startSec);
        return;
    }

    currentStreamRawUrl = media.url;
    activeSubtitleCacheKey = media.subtitle ? `${String(media.subtitle).trim()}::offset=${Number(startSec) || 0}` : null;
    const loadToken = ++episodeLoadToken;
    const subtitles = [];
    if (media.subtitle && String(media.subtitle).trim() !== '') {
        subtitles.push({
            html: 'SUBTITLES',
            url: String(media.subtitle).trim(),
            default: true,
            offsetSeconds: startSec
        });
    }

    const isCombinedPart = startSec > 0 || endSec > 0;

    art = await initZoneVideoPlayer({
        container: "#artplayer",
        data: {
            url: media.url,
            title: media.title || ep.title
        },
        poster: media.image || THUMBNAIL,
        ep: ep,
        subtitles: subtitles,
        playlistData: playlistData,
        auth: auth,
        db: db,
        pageIdentifier: pageIdentifier,
        historyKey: currentHistoryKey,
        loadToken: loadToken,
        getCurrentLoadToken: () => episodeLoadToken,
        resumeFromHistory: !isCombinedPart,
        onNextEpisode: () => window.playNextEpisodeGlobal(),
        onSkipIntro: () => window.skipIntroGlobal(),
        onTimeUpdate: (artInstance) => handleCombinedEpisodeTimeUpdate(artInstance),
        onLoadedMetadata: (artInstance) => {
            if (startSec > 0) {
                manualSeekLockUntil = Date.now() + 1500;
                artInstance.currentTime = startSec;
            }
            artInstance.play().catch(() => {});
            prewarmNextCardSubtitle(ep.id);
        }
    });

    if (art) {
        art.on('video:ended', () => {
            window.playNextEpisodeGlobal();
        });
    }
}

window.addEventListener('popstate', (event) => {
    if (event.state && event.state.id) loadAndPlayEpisode(event.state.id, false);
    else { 
        posterContainer.style.display = "flex"; 
        playerContainer.style.display = "none"; 
        mainTitle.textContent = '';
        currentStreamRawUrl = null;
        activeSubtitleCacheKey = null;
        document.querySelectorAll('.playlist-item').forEach(item => item.classList.remove('active', 'is-paused'));
        episodeLoadToken++;
        cleanupPlayer();
    }
});

// --- 5. BUILD THE 30 VIDEO CARDS ---
function renderPlaylistCards() {
    playlistContainer.innerHTML = '';
    playlistData.forEach(ep => {
        const epDiv = document.createElement('div');
        epDiv.className = 'playlist-item';
        if (window.currentEpData && window.currentEpData.id === ep.id) {
            epDiv.classList.add('active');
        }
        epDiv.dataset.id = ep.id;

        const imgWrapper = document.createElement('div');
        imgWrapper.className = "playlist-img-wrapper";
        
        const img = document.createElement('img'); 
        img.src = ep.image || THUMBNAIL; 
        img.loading = "lazy";
        img.alt = ep.title || `Stream ${ep.id}`;
        imgWrapper.appendChild(img);
        
        const textDiv = document.createElement('div'); 
        textDiv.className = "playlist-text";
        
        const title = document.createElement('span'); 
        title.className = "playlist-title"; 
        title.textContent = ep.title;
        textDiv.appendChild(title);

        const indicator = document.createElement('div');
        indicator.className = 'playing-indicator';
        indicator.innerHTML = '<div class="bar"></div><div class="bar"></div><div class="bar"></div>';
        
        epDiv.appendChild(imgWrapper); 
        epDiv.appendChild(textDiv);
        epDiv.appendChild(indicator);
        
        epDiv.addEventListener('click', () => loadAndPlayEpisode(ep.id, true));
        playlistContainer.appendChild(epDiv);
    });
}

renderPlaylistCards();
ensureVaultLoaded();

window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v');
    if (videoId) {
        setTimeout(() => loadAndPlayEpisode(videoId, false), 500);
    }
});
</script>

<script>
  const allowedPaths = [
    '/index.html',
    '/home.html',
    '/videos.html',
    '/videos',
    '/home',
    '/nanabnb.html',
    '/newtour.html',
    '/hxwfanconcert.html',
    '/svtholiday.html',
    '/arenatour.html',
    '/svtjapanconcert.html',
    '/touragain.html',
    '/gallery.html',
    '/profile.html',
    '/soon.html'
  ];

  const currentPage = window.location.pathname;
  let hasInternalAccess = sessionStorage.getItem('internalAccess') === 'true';

  const referrer = document.referrer;
  let cameFromAllowedPage = false;
  if (referrer) {
    try {
      const refUrl = new URL(referrer);
      if (refUrl.origin === window.location.origin && allowedPaths.includes(refUrl.pathname)) {
        cameFromAllowedPage = true;
      }
    } catch (_) {}
  }

  if (cameFromAllowedPage) {
    sessionStorage.setItem('internalAccess', 'true');
    hasInternalAccess = true;
  }

  const isIndexPage = currentPage.endsWith('index.html') || currentPage === '/';
  if (!hasInternalAccess && !isIndexPage) {
    showAccessDeniedModal();
  }

  function showAccessDeniedModal(msg) {
    let existingModal = document.querySelector('.access-denied-modal');
    if (existingModal) existingModal.remove();

    const currentUser = (typeof auth !== 'undefined' && auth && auth.currentUser) || null;
    const username = (currentUser && (currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : ''))) || 'Guest / Unknown';
    const uid = (currentUser && currentUser.uid) || 'Not logged in';

    const modal = document.createElement('div');
    modal.className = 'access-denied-modal';
    modal.innerHTML = `
      <strong style="color:#FF4444; font-size:28px; margin-bottom:15px; display:block;">Access Restricted</strong>
      <div style="font-size:15px; margin-bottom:20px; line-height:1.5; max-width:480px; color:#eaeaea;">${msg || "You cannot access this page directly.<br>Please go through the homepage or allowed sections."}</div>
      
      <div style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:16px 20px; margin-bottom:24px; text-align:left; max-width:440px; width:100%; box-sizing:border-box;">
        <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#8e8e99; margin-bottom:10px; font-weight:700;">Account Details</div>
        <div style="font-size:13px; color:#fcfcfc; margin-bottom:8px; display:flex; justify-content:space-between; gap:12px;">
          <span style="color:#a1a1aa;">Username:</span>
          <span style="font-weight:600; text-align:right;">${username}</span>
        </div>
        <div style="font-size:13px; color:#fcfcfc; display:flex; justify-content:space-between; gap:12px; word-break:break-all;">
          <span style="color:#a1a1aa; flex-shrink:0;">UID:</span>
          <code style="font-family:'JetBrains Mono', monospace; font-size:12px; color:#d4d4d8; background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; user-select:all;">${uid}</code>
        </div>
      </div>

      <button onclick="goBackSafe()" style="padding:14px 36px; border-radius:50px; background:#ffffff; color:#0a0a0c; border:none; cursor:pointer; font-weight:700; font-size:14px; letter-spacing:1px; text-transform:uppercase; transition:all 0.2s; box-shadow:0 8px 24px rgba(255,255,255,0.2);">
        <i class="fas fa-arrow-left" style="margin-right:8px;"></i> Back to Videos
      </button>
    `;
    document.body.appendChild(modal);
  }

  function goBackSafe() {
    window.location.href = '/videos';
  }

  function goBack() {
    goBackSafe();
  }
</script>
