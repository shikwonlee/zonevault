<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Concert / Video Title | Zone Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> 
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <!-- Player Engines (ArtPlayer & HLS.js) -->
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="icon" href="/favicon-new.png" type="image/png" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0c">

  <!-- Shared Universal Player Stylesheet (Nasa Top-Left na ang Back button) -->
  <link rel="stylesheet" href="css/player.css">
</head>

<body>

<div class="noise-overlay"></div>

<!-- ADMIN BADGE TOAST -->
<div id="adminToast" class="admin-toast">
  <i class="fas fa-shield-alt"></i> You are using ADMIN ACCOUNT
</div>

<div class="main-layout">

  <!-- LEFT: VIDEO PLAYER -->
  <div class="video-wrapper-left">
    <a href="/videos" class="back-to-video-btn">
      <i class="fas fa-arrow-left"></i> Back to Video
    </a>
    <div id="poster-container">
      <div id="poster-overlay">Play Episode</div>
    </div>

    <div id="player-container">
       <div id="artplayer" class="art-video-player"></div>
       
       <!-- GESTURE OVERLAYS (Double-tap seek & single-tap play/pause) -->
       <div id="click-catcher"></div>
       <div class="gesture-overlay">
           <div id="icon-rewind" class="gesture-icon" style="left: 20%;">
               <div>
                   <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"></path></svg>
                   <span>-10s</span>
               </div>
           </div>
           <div id="icon-forward" class="gesture-icon" style="left: 80%;">
               <div>
                   <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"></path></svg>
                   <span>+10s</span>
               </div>
           </div>
           <div id="icon-play" class="gesture-icon" style="left: 50%;">
               <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
           </div>
           <div id="icon-pause" class="gesture-icon" style="left: 50%;">
               <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
           </div>
       </div>
    </div>

    <!-- TITLE BOX BELOW VIDEO -->
    <div class="title-box">
        <div class="current-episode-label">Now Playing</div>
        <h2 id="main-title"></h2>
    </div>
  </div>

  <!-- RIGHT: PLAYLIST CARD -->
  <div id="playlist">
    <div class="playlist-card">
        <div class="playlist-header">Episodes</div>
        <div id="playlist-items"></div>
    </div>
  </div>

</div> 

<!-- 1. Centralized Secure Player Engine (Nakatago ang m3u8 at Firebase resolution) -->
<script src="/api/secret/player-core.js"></script>

<!-- 2. Your Page-specific JS Config File -->
<script src="js/your_page_name.js"></script>

</body>
</html>
