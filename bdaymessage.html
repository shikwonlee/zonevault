<body>

  <!-- Video Container -->
  <div class="video-wrapper">
    <div class="loading" id="loading"></div>
    <video id="player" playsinline muted autoplay controls>
      <source src="https://stream.mux.com/tUBpyfKYbtpaaHjoFSJDU3Ap502EgeZMCcTL02L0274M008.m3u8" type="application/x-mpegURL" />
    </video>
  </div>

  <!-- Video Title -->
  <div class="video-title">[H.B.D] MESSAGE FOR OCTOBER CARAT 💎</div>

  <!-- Plyr JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script>
    const video = document.getElementById('player');
    const source = video.querySelector('source').src;
    const loader = document.getElementById('loading');

    // HLS setup
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = source;
    }

    // Plyr init
    const player = new Plyr(video, {
      ratio: '9:16',
      autoplay: true,
      muted: true, // safer for autoplay
      clickToPlay: true,
      controls: ['play', 'current-time', 'mute']
    });

    // Autoplay fallback
    player.play().catch(() => {
      console.warn("Autoplay blocked. Waiting for user interaction.");
    });

    // Remove loading shimmer once video starts
    video.addEventListener('playing', () => loader.style.display = 'none');
  </script>

  <!-- Cache Cleaner (Unregisters stale service workers) -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let r of regs) r.unregister();
      });
    }
  </script>
  

</body>
