<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Code | Zone Vault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, initial-scale=1.0, viewport-fit=cover"/>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon-new.png" type="image/png">
  <meta name="theme-color" content="#050505">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/code.css">
</head>
<body>

<div class="bg-gradient"></div>
<div class="noise-overlay"></div>

<button id="back-btn" onclick="window.location.href='index.html'">
  <i class="fas fa-arrow-left"></i>
</button>

<div class="glass-card">
  
  <div id="quick-code-section">
    <h2>Quick Access</h2>
    <p class="subtitle">Enter your code to unlock the vault instantly.</p>
    
    <div class="input-icon-group">
      <i class="fas fa-user input-icon"></i>
      <input type="text" id="guest-name" placeholder="Choose a Nickname (Optional)">
    </div>

    <div class="input-icon-group">
      <i class="fas fa-unlock-alt input-icon"></i>
      <input type="text" id="quick-code-input" placeholder="e.g. zonevault-XYZ" required>
    </div>

    <div class="button-stack">
      <button class="action-btn" id="btn-quick-login" onclick="quickCodeLogin()">Unlock Vault</button>
    </div>
  </div>

  <div id="approved" class="hidden text-center">
    <div style="margin-bottom:15px; margin-top:20px;">
        <i class="fas fa-check-circle"></i>
    </div>
    <h3>Access Granted</h3>
    <p style="color: var(--text-muted); margin-top: 5px;">Entering the Vault...</p>
  </div>

</div>

<script type="module" src="js/code.js"></script>

</body>
</html>
