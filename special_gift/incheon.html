<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INCHEON SPECIAL GIFTS | Zone Vault</title>
   
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/incheon.css">
</head>
<body>


<div id="toast" class="toast">
    <i class="fas fa-check-circle" style="color:var(--status-online);"></i>
    <span>Welcome to Collections</span>
</div>


<div class="main-wrapper fade-in">
    <div class="header-row">
        <h1 class="page-title">SEVENTEEN WORLD TOUR [NEW_] IN INCHEON SPECIAL GIFTS</h1>
    </div>

    <div class="collection-section">
        <div class="gallery-grid" id="grid-category"></div>
    </div>
</div>

<a href="/collection" class="back-to-cat-btn">
    <i class="fas fa-arrow-left"></i> Back to Collections
</a>

<div id="lightbox" class="lightbox-overlay">
    <div class="lightbox-controls">
        <div class="lightbox-btn" onclick="downloadImage()">
            <i class="fas fa-download"></i>
        </div>
        <div class="lightbox-btn" onclick="closeLightbox()">
            <i class="fas fa-times"></i>
        </div>
    </div>
    
    <div class="lightbox-content-wrapper">
        <img id="lightbox-img" src="" class="lightbox-content">
    </div>

    <div id="lightbox-thumbs" class="lightbox-thumbs">
    </div>
</div>

<script type="module" src="/special_gift/js/incheon.js"></script>

</body>
</html>
